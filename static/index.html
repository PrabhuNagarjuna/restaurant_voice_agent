<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Restaurant Assistant</title>
<style>
 body{font-family:system-ui,Arial,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem;color:#222}
 #log{border:1px solid #ccc;border-radius:8px;padding:1rem;min-height:260px;max-height:55vh;overflow:auto;background:#fafafa}
 .u{color:#0b5;margin:.4rem 0}.a{color:#05c;margin:.4rem 0}.t{color:#888;font-size:.8rem}
 button{padding:.6rem 1.1rem;border:0;border-radius:8px;background:#05c;color:#fff;font-size:1rem;cursor:pointer}
 button.rec{background:#c22} input{padding:.6rem;width:60%;border:1px solid #ccc;border-radius:8px}
 .row{margin-top:.8rem;display:flex;gap:.5rem;align-items:center}
</style></head><body>
<h2>Voice Restaurant Assistant</h2>
<div id="log"></div>
<div class="row"><button id="mic">Hold to talk</button><span id="status" class="t"></span></div>
<div class="row"><input id="txt" placeholder="…or type a message"><button id="send">Send</button></div>
<script>
let sid = null, rec = null, chunks = [];
const log = document.getElementById('log'), status = document.getElementById('status');
const add = (cls, who, text, tools) => {
  const d = document.createElement('div'); d.className = cls; d.textContent = who + ': ' + text; log.appendChild(d);
  (tools || []).forEach(t => { const x = document.createElement('div'); x.className = 't'; x.textContent = '  ↳ tool: ' + t.tool + ' ' + JSON.stringify(t.input); log.appendChild(x); });
  log.scrollTop = log.scrollHeight;
};
async function post(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(await r.text()); return r.json(); }

document.getElementById('send').onclick = async () => {
  const el = document.getElementById('txt'), m = el.value.trim(); if (!m) return; el.value = '';
  add('u', 'You', m);
  try {
    const j = await post('/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:m, session_id:sid})});
    sid = j.session_id; add('a', 'Assistant', j.reply, j.tool_calls);
  } catch (e) { add('a', 'Error', e.message); }
};

const mic = document.getElementById('mic');
async function start() {
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  rec = new MediaRecorder(stream); chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop()); status.textContent = 'thinking…';
    const fd = new FormData(); fd.append('audio', new Blob(chunks, {type: rec.mimeType}), 'speech.webm'); if (sid) fd.append('session_id', sid);
    try {
      const j = await post('/voice', {method:'POST', body: fd}); sid = j.session_id;
      add('u', 'You', j.transcript || '(nothing heard)'); add('a', 'Assistant', j.reply, j.tool_calls);
      new Audio('data:audio/mpeg;base64,' + j.audio_mp3_base64).play(); status.textContent = '';
    } catch (e) { add('a', 'Error', e.message); status.textContent = ''; }
  };
  rec.start(); mic.classList.add('rec'); mic.textContent = 'Listening…';
}
const stop = () => { if (rec && rec.state === 'recording') { rec.stop(); mic.classList.remove('rec'); mic.textContent = 'Hold to talk'; } };
mic.onmousedown = mic.ontouchstart = e => { e.preventDefault(); start(); };
mic.onmouseup = mic.onmouseleave = mic.ontouchend = stop;
</script></body></html>
